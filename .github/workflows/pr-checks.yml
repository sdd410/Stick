# PR checks for Stick. Runs on every pull request into develop (the base
# branch) and master (what is live).
# Three jobs, each shown as its own check on the PR:
#   Sanity      - lockfile respected, no signing secrets, formatting, generated code up to date
#   Code check  - static analysis (warnings/errors fail; infos don't) and the full test suite
#   Build check - release APK builds, and its permissions stay within what the app needs
name: PR checks

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: No signing secrets committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)key\.properties$|\.jks$|\.keystore$|(^|/)local\.properties$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must never be committed:"
            echo "$bad"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies match pubspec.lock
        run: flutter pub get --enforce-lockfile

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generated code is up to date (drift)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- lib; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' and commit."
            exit 1
          fi

  code:
    name: Code check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # No key.properties in CI, so the release build is signed with the debug
      # key. That's fine here: this checks that release mode (R8, resources,
      # manifest merge) builds, not that it's uploadable.
      - name: Build release APK
        run: flutter build apk --release

      - name: Permissions stay within what Stick needs
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ -x "$analyzer" ]; then
            perms=$("$analyzer" manifest permissions "$apk")
          else
            aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
            perms=$("$aapt" dump permissions "$apk")
          fi
          echo "$perms"
          # Offline app: no internet. Inexact reminders: no exact alarms.
          # Clips live in app storage: no shared-storage access.
          forbidden='android\.permission\.(INTERNET|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z_]+|MANAGE_EXTERNAL_STORAGE)'
          if echo "$perms" | grep -E "$forbidden"; then
            echo "::error::The release APK asks for a permission Stick must not use (see above)."
            exit 1
          fi

      - name: Check targetSdk 36 and minSdk 24
        run: |
          grep -q 'targetSdk = 36' android/app/build.gradle.kts || { echo "::error::targetSdk must be 36 (Play requirement)"; exit 1; }
          grep -q 'minSdk = 24' android/app/build.gradle.kts || { echo "::error::minSdk must be 24"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: stick-release-apk-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
