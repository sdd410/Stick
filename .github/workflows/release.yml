# Release to Google Play. Run by hand: Actions → "Release to Play" → Run workflow.
#
# Branches:
#   develop - base branch; releases go to testers (internal or closed track)
#   master  - what is live; the only branch allowed to release to production
#
# It runs the checks, builds a signed .aab with the upload key, uploads it to
# the chosen track as a DRAFT (you press "Start rollout" in the Play Console),
# tags the commit v<version> and keeps the .aab as a run artifact.
#
# One-time setup (repo secrets) is described in docs/RELEASING.md.
name: Release to Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.2.0 (needs docs/release-notes/<version>.txt)"
        required: true
        type: string
      track:
        description: "Play track"
        required: true
        default: closed
        type: choice
        options: [internal, closed, production]
      pro_unlocked:
        description: "Unlock all Pro features (testing tracks only)"
        required: true
        default: true
        type: boolean
      build_number:
        description: "Build number (versionCode). Leave empty to use 100 + run number"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # to push the v<version> tag

env:
  FLUTTER_VERSION: "3.50.1"
  PACKAGE_NAME: com.th3on3guy.stick

jobs:
  release:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
          PRO: ${{ inputs.pro_unlocked }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0 (got '$VERSION')"; exit 1
          fi
          if [ "$TRACK" = production ] && [ "$BRANCH" != master ]; then
            echo "::error::Production releases only from master (this run is on '$BRANCH')"; exit 1
          fi
          if [ "$TRACK" = production ] && [ "$PRO" = true ]; then
            echo "::error::Production builds must not unlock Pro for free. Untick 'pro_unlocked'."; exit 1
          fi
          if [ "$TRACK" != production ] && [ "$BRANCH" != develop ] && [ "$BRANCH" != master ]; then
            echo "::error::Release from develop or master only (this run is on '$BRANCH')"; exit 1
          fi
          notes="docs/release-notes/$VERSION.txt"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes (Play release notes, max 500 characters)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."; exit 1
          fi
          code="${BUILD_NUMBER:-$((100 + RUN_NUMBER))}"
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be a whole number (got '$code')"; exit 1
          fi
          case "$TRACK" in
            internal) play=internal ;;
            closed) play=alpha ;;   # Play's default closed testing track
            production) play=production ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "play_track=$play" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($code) from $BRANCH to $TRACK ($play), Pro unlocked: $PRO"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Checks (format, analyze, tests)
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test

      - name: Signing key (from secrets, never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. See docs/RELEASING.md."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the signed .aab
        env:
          VERSION: ${{ inputs.version }}
          CODE: ${{ steps.inputs.outputs.code }}
          PRO: ${{ inputs.pro_unlocked }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION" --build-number="$CODE" \
            --dart-define=ALL_PRO="$PRO"

      - name: Signed with the upload key, and no forbidden permissions
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key."; exit 1
          fi
          forbidden='android\.permission\.(INTERNET|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z_]+|MANAGE_EXTERNAL_STORAGE)'
          if unzip -p "$aab" base/manifest/AndroidManifest.xml | strings | grep -E "$forbidden"; then
            echo "::error::The bundle asks for a permission Stick must not use."; exit 1
          fi

      - name: Release notes for Play
        env:
          NOTES: ${{ steps.inputs.outputs.notes }}
        run: |
          mkdir -p play-notes
          # Our files wrap the text in <en-US>…</en-US>; Play wants plain text.
          sed -e '/^<en-US>$/d' -e '/^<\/en-US>$/d' "$NOTES" > play-notes/whatsnew-en-US
          chars=$(wc -m < play-notes/whatsnew-en-US)
          if [ "$chars" -gt 500 ]; then
            echo "::error::Release notes are $chars characters; Play allows 500."; exit 1
          fi
          cat play-notes/whatsnew-en-US

      - name: Upload to Google Play (draft)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.inputs.outputs.play_track }}
          status: draft
          releaseName: ${{ inputs.version }} (${{ steps.inputs.outputs.code }})
          whatsNewDirectory: play-notes

      - name: Keep the .aab
        uses: actions/upload-artifact@v4
        with:
          name: stick-${{ inputs.version }}-${{ steps.inputs.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Remove the signing key
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          CODE: ${{ steps.inputs.outputs.code }}
          TRACK: ${{ inputs.track }}
        run: |
          {
            echo "### Stick $VERSION ($CODE) uploaded to **$TRACK** as a draft"
            echo
            echo "Open Play Console → Stick → Testing/Production → the draft release → **Start rollout**."
          } >> "$GITHUB_STEP_SUMMARY"
